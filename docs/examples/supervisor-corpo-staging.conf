; Local web-only qualification. Replace USER and DEV_APPLICATION_ID before use.
; Source stays on jons-tree-branch; credentials and logs stay outside the checkout.
; The private MySQL instance and web configuration must exist before startup.

[program:mysql-dev]
command=/usr/sbin/mysqld --defaults-file=/home/USER/CorpoCH/staging/mysql/mysql.conf
directory=/home/USER/CorpoCH/staging/mysql
user=USER
autostart=false
autorestart=unexpected
startsecs=5
startretries=3
stopwaitsecs=60
stopsignal=TERM
stopasgroup=true
killasgroup=true
umask=0077
priority=100
stdout_logfile=/home/USER/CorpoCH/staging/log/mysql-supervisor.log
stderr_logfile=/home/USER/CorpoCH/staging/log/mysql-supervisor-error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:web-dev]
command=/home/USER/CorpoCH/staging/venv/bin/python -B -m staging --config /home/USER/CorpoCH/staging/web/config.json --expected-bot-id DEV_APPLICATION_ID serve
directory=/mnt/c/git/corpo-ch
user=USER
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"
autostart=false
autorestart=unexpected
startsecs=5
startretries=3
stopwaitsecs=30
stopsignal=INT
stopasgroup=true
killasgroup=true
umask=0077
priority=200
stdout_logfile=/home/USER/CorpoCH/staging/log/web.log
stderr_logfile=/home/USER/CorpoCH/staging/log/web-error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[group:corpo-dev]
programs=mysql-dev,web-dev
priority=999

; worker-dev, beat-dev, dbot-dev and ch-dev are not registered in this phase.
; Add them only after their isolated settings and output restrictions are verified.
